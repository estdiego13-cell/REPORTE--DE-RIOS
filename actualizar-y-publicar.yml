name: Actualizar fuentes y publicar app
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crecidas-pages
  cancel-in-progress: false
jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar fuentes y conservar datos validos
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Guardar corte en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar datos de crecidas y pronostico"
            git push
          fi
      - name: Preparar pagina estatica
        run: |
          mkdir -p public
          cp index.html data.json .nojekyll public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  publicar:
    needs: datos
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
